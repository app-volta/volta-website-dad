name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: app-volta/volta-devops/.github/workflows/reusable-validate-pr.yaml@v1

  build-test:
    name: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificação de tipos
        run: npx tsc --noEmit

      - name: Build de produção
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

      - name: Publicar o bundle como artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-website
          path: dist/
          retention-days: 5